<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/output.css">
    <title>rockpapersci</title>
  </head>
  <body>
    <div class="w-full h-screen overflow-hidden bg-[#D3D3FF]/60 relative ">
      <div class="absolute w-50 h-50 bg-[#D3D3FF] rounded-full -left-25 -top-15"></div>
      <div class="absolute w-40 h-40 bg-[#9D9DCC]/30 rounded-full -left-25 -bottom-10"></div>
      <div class="absolute w-65 h-65 bg-pink-300/20 rounded-full -right-25 -top-15"></div>

      <div class="flex flex-col  justify-center items-center p-3">
        <img src="./src/assets/two-hands-svgrepo-com (1).svg" class="h-10 w-10 rounded-xl bg-white " alt="">
        <p class="font-mono text-[9px] pt-1 text-[#3d24ff] z-99">A TINY GAME OF CHANCE</p>
        <h2 class="font-bold text-2xl sm:text-3xl md:text-4xl lg:text-5xl z-99 "><span class="bg-clip-text bg-linear-to-r from-[#3d24ff] to-purple-600 text-transparent">Rock </span>
          <span class="bg-clip-text bg-linear-to-r from-purple-600 to-pink-600 text-transparent ">Paper </span>
          <span class="bg-clip-text bg-linear-to-r from-pink-600  to-teal-600 text-transparent ">Scissors</span>
        </h2>
        <p class="text-gray-500 p-2 text-xs sm:text-sm z-99">Choose your move, beat the computer, and keep track of your score!</p>
        
        <div class="bg-white rounded-xl max-w-xl w-10/12  p-2 flex flex-col justify-evenly items-center shadow-2xl font-semibold sm:flex-row gap-2">
          <div class="bg-blue-400/10 flex w-full rounded-lg p-1 text-blue-700">
            <span class="text-sm flex-1" >You</span>
            <span id="myScore" class="font-bold ">0</span>
          </div>

          <div class=" w-full flex flex-col items-center ">
            <p class="text-[7px] font-mono text- ">FIRST TO 5</p>
            <div class="h-0.5 w-12/12 shrink rounded-full bg-linear-to-r from-[#3d24ff] to-pink-600 sm:w-30  "></div>
          </div>
          <div class="bg-purple-700/10 w-full flex rounded-lg p-1 text-purple-900 ">
            <span class="text-sm flex-1 ">Computer</span>
            <span id="cmpScore" class="font-bold  ">0</span>
          </div>
          
          

        </div>
        <div class="mt-3 rounded-xl w-10/12 max-w-xl bg-white shadow-2xl sm:p-6 p-4 ">
          <p id="result" class="bg-blue-400/10 rounded-2xl p-1 pl-2 font-semibold text-[14px] text-center text-indigo-600 mb-5 ">✨ Your turn - choose a move!</p>
          <div class="flex justify-center items-center gap-9">
            <div class="flex flex-col items-center ">
              <div id="myMove" class="bg-blue-400/10 w-15 h-15 text-3xl items-center justify-center flex rounded-full sm:h-23 sm:w-23 sm:text-5xl">✊</div>
              <p class="text-indigo-500 text-[12px] mt-2">You</p>
            </div>
            <div class=" flex flex-col items-center">
              <div class="h-0.5 w-10 bg-purple-400/10 rounded-full"></div>
              <p class="text-center">VS</p>
              <div class="h-0.5 w-10 bg-purple-400/10 rounded-full"></div>
            </div>  
            <div class=" flex flex-col items-center">
              <div id="cmpMove" class="bg-purple-700/20 w-15 h-15 text-3xl items-center justify-center flex rounded-full sm:h-23 sm:w-23 sm:text-5xl">🤖</div>
              <p class="text-indigo-500 text-[12px] mt-2">Computer</p>
            </div>
          </div>
          

          <p class="font-bold text-[13px] text-center mt-5">Make your move</p>
          <div class="flex justify-evenly items-center mt-3 gap-2">
              <button id="rock" class="bg-blue-400/10 rounded-2xl w-4/12  p-2 hover:bg-blue-200">
                <div class="flex flex-col items-center ">
                  <div class="bg-blue-400/20 w-10 h-10 text-3xl items-center justify-center flex rounded-full sm:h-17 sm:w-17 sm:text-5xl">✊</div>
                  <p class="font-bold text-[12px] mt-2">Rock</p>
                </div>

              </button>
              <button id="paper" class="bg-red-400/10 rounded-2xl w-4/12  p-2 hover:bg-red-200">
                <div class="flex flex-col items-center ">
                  <div class="bg-red-400/20 w-10 h-10 text-3xl items-center justify-center flex rounded-full sm:h-17 sm:w-17 sm:text-5xl">✋</div>
                  <p class="font-bold text-[12px] mt-2">Paper</p>
                </div>

              </button>
              <button id="scissor" class="bg-green-400/10 rounded-2xl w-4/12  p-2 hover:bg-green-200">
                <div class="flex flex-col items-center ">
                  <div class="bg-green-400/20 w-10 h-10 text-3xl items-center justify-center flex rounded-full sm:h-17 sm:w-17 sm:text-5xl">✌️</div>
                  <p class="font-bold text-[12px] mt-2">Scissors</p>
                </div>

              </button>

          </div>
          <p class=" mt-4 border border-gray-300 "></p>
          <div class="flex justify-between mt-4 items-center">
            <p class="text-center text-[9px] text-slate-400">Rock beats scissors. Scissors beat paper. Paper beats rock.</p>
            <button id="reset" class="border rounded-2xl px-3 py-2  border-gray-300 text-violet-500 text-[10px]  hover:bg-violet-50 ">↻ Reset Game</button>
          </div>

          
        </div>
        <p class="text-[10px] mt-2 text-purple-500">♡ Good Luck, have fun!</p>

        
      </div>
      
     
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
